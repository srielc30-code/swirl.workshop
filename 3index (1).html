<h2>YOUR REWARD: How to Make Homemade Ice Cream</h2>

<ol>
    <li>Pour heavy cream and milk into a bowl.</li>
    <li>Add sugar and vanilla extract.</li>
    <li>Mix everything together.</li>
    <li>Freeze the mixture until firm, stirring occasionally.</li>
    <li>Scoop into a bowl and enjoy!</li>
</ol>
